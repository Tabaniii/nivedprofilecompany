  <!-- Editor Main Area -->
  <text x="250" y="90" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700"># Engineering Architecture 2025</text>
  <text x="250" y="125" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Offline-first distributed synchronization powered by CRDTs.</text>
  
  <!-- Markdown blockquote / code block mockup -->
  <rect x="250" y="150" width="480" height="85" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="270" y="180" fill="#38bdf8" font-family="monospace" font-size="12">const engine = new SyncEngine({ mode: 'p2p' });</text>
  <text x="270" y="205" fill="#10b981" font-family="monospace" font-size="12">await engine.reconcileLocalState();</text>

  <!-- Live visual graph node linking -->
  <rect x="250" y="260" width="480" height="170" rx="8" fill="#111827" fill-opacity="0.5" stroke="#1f2937" stroke-width="1" />
  <circle cx="330" cy="340" r="28" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" />
  <text x="312" y="345" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Core</text>

  <line x1="358" y1="340" x2="442" y2="310" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="470" cy="300" r="26" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
  <text x="450" y="305" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sync</text>

  <line x1="358" y1="340" x2="442" y2="380" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="470" cy="390" r="26" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2" />
  <text x="452" y="395" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Edge</text>

  <line x1="496" y1="300" x2="584" y2="340" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="610" cy="345" r="24" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
