<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#flow-bg)" />
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Left Sidebar (Tree / Explorer) -->
  <rect x="40" y="40" width="180" height="420" rx="12" fill="#18181b" fill-opacity="0.7" />
  <circle cx="65" cy="65" r="5" fill="#ef4444" />
  <circle cx="82" cy="65" r="5" fill="#f59e0b" />
  <circle cx="99" cy="65" r="5" fill="#10b981" />
  
  <rect x="65" y="100" width="90" height="10" rx="3" fill="#a1a1aa" />
  <rect x="80" y="130" width="110" height="8" rx="2" fill="#71717a" />
  <rect x="80" y="150" width="95" height="8" rx="2" fill="#71717a" />
  <rect x="80" y="170" width="120" height="8" rx="2" fill="#38bdf8" />
