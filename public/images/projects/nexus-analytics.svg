<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="nexus-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#nexus-bg)" />
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#111827" fill-opacity="0.8" stroke="#1f2937" stroke-width="1.5" />
  
  <!-- Header -->
  <circle cx="70" cy="70" r="6" fill="#ef4444" />
  <circle cx="92" cy="70" r="6" fill="#f59e0b" />
  <circle cx="114" cy="70" r="6" fill="#10b981" />
  <text x="145" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NEXUS // REALTIME TELEMETRY</text>

  <!-- Metric stat cards -->
  <rect x="70" y="105" width="200" height="90" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  <text x="90" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">RPS INGESTION</text>
  <text x="90" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">14,290 /s</text>

  <rect x="290" y="105" width="200" height="90" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  <text x="310" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">P99 LATENCY</text>
  <text x="310" y="165" fill="#10b981" font-family="system-ui, sans-serif" font-size="24" font-weight="700">18.4 ms</text>

  <rect x="510" y="105" width="210" height="90" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  <text x="530" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">HEALTH STATUS</text>
  <text x="530" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">OPTIMAL</text>

  <!-- Telemetry Graph Chart -->
  <rect x="70" y="215" width="650" height="215" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
  <!-- Grid lines -->
  <line x1="100" y1="260" x2="690" y2="260" stroke="#1f2937" stroke-dasharray="4 4" />
  <line x1="100" y1="310" x2="690" y2="310" stroke="#1f2937" stroke-dasharray="4 4" />
  <line x1="100" y1="360" x2="690" y2="360" stroke="#1f2937" stroke-dasharray="4 4" />
  
  <!-- Wave / Line chart -->
  <path d="M100 370 Q 180 320, 240 340 T 360 270 T 480 290 T 580 240 T 680 270" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M100 390 Q 180 360, 240 370 T 360 320 T 480 340 T 580 310 T 680 320" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.7" />
  
  <circle cx="580" cy="240" r="5" fill="#38bdf8" />
  <rect x="545" y="210" width="70" height="22" rx="4" fill="#38bdf8" />
  <text x="555" y="225" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Peak 98.4%</text>
</svg>
